# Atuin configuration
# https://docs.atuin.sh/configuration/config/

# ─── Sync (disabled: local-only mode) ────────────────────────
# Do not set sync_address. Atuin parses it as an absolute URL, so an
# empty string fails settings deserialization and breaks `atuin init`.
auto_sync = false

# ─── Search ──────────────────────────────────────────────────
search_mode = "fuzzy"
filter_mode = "global"
style = "compact"

# ─── History ─────────────────────────────────────────────────
update_check = false
