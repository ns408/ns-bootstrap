name: Bootstrap Test

on:
  schedule:
    - cron: '0 9 1,15 * *'  # 1st and 15th of each month at 09:00 UTC (fortnightly)
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to test (ubuntu only)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - minimal
          - developer
          - cloud-engineer

jobs:
  ubuntu-bootstrap:
    name: Ubuntu (${{ matrix.profile }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, developer, cloud-engineer]
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y sudo curl git

      - uses: actions/checkout@v7

      - name: Create test user
        run: |
          useradd -m -s /bin/bash testuser
          echo "testuser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R testuser:testuser "$GITHUB_WORKSPACE"

      - name: Run bootstrap
        run: |
          su - testuser -c "cd $GITHUB_WORKSPACE && ./install/bootstrap.sh --profile ${{ matrix.profile }} --yes"
        env:
          NONINTERACTIVE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify core tools
        run: |
          su - testuser -c "command -v git && command -v jq && command -v curl"

      - name: Verify modern CLI tools
        run: |
          su - testuser -c "command -v rg && command -v fd && command -v fzf && command -v bat"

      # These installs warn and continue rather than aborting the bootstrap, so
      # CI is the only thing standing between an upstream breakage and a machine
      # that quietly comes up missing tools.
      - name: Verify non-fatal tool installs
        run: |
          su - testuser -c '
            missing=""
            for tool in eza zoxide delta btm dust procs hyperfine bandwhich atuin mise; do
              command -v "$tool" >/dev/null || missing="$missing $tool"
            done
            [ -z "$missing" ] || { echo "Missing after bootstrap:$missing"; exit 1; }
            echo "All non-fatal tool installs present"
          '

      # update-my-system is otherwise never exercised on Ubuntu. Run straight
      # after bootstrap, it also proves install and update share one tool list:
      # every Rust tool should report as already current, none reinstalled.
      - name: Run update-my-system
        shell: bash
        run: |
          cat > /tmp/run-update.sh <<EOF
          export NS_BOOTSTRAP_DIR="$GITHUB_WORKSPACE"
          source "\$NS_BOOTSTRAP_DIR/shell/platform/ubuntu/update-system.sh"
          update-my-system
          EOF
          chmod 755 /tmp/run-update.sh
          su - testuser -c "bash /tmp/run-update.sh" > /tmp/update.log 2>&1 || true
          cat /tmp/update.log

          expected=$(grep -cvE '^(#|$)' packages/binstall-tools.ubuntu)
          current=$(grep -c "is already installed" /tmp/update.log || true)
          grep -q -- "--- Rust CLI tools (cargo-binstall) ---" /tmp/update.log \
            || { echo "update-my-system never reached the Rust tools section"; exit 1; }
          if grep -q "Installing binaries" /tmp/update.log; then
            echo "update-my-system reinstalled tools that bootstrap had just installed"; exit 1
          fi
          [ "$current" -eq "$expected" ] \
            || { echo "Expected ${expected} tools already current, found ${current}"; exit 1; }
          echo "All ${expected} Rust tools already current; nothing reinstalled"
          grep -q -- "--- Pinned repositories" /tmp/update.log \
            || { echo "update-my-system never reached the pinned repositories"; exit 1; }
          if grep -qE "^.{0,80}: [0-9a-f]{12} → " /tmp/update.log; then
            echo "update-my-system moved a pinned repository that bootstrap had just set"; exit 1
          fi

      - name: Verify security tools
        run: |
          su - testuser -c "command -v gitleaks && gitleaks version"

      - name: Verify cloud tools
        if: matrix.profile == 'cloud-engineer'
        run: |
          su - testuser -c "command -v terraform && command -v kubectl && command -v helm && command -v az && command -v aws"

      - name: Verify dotfiles symlinked
        run: |
          su - testuser -c "test -L ~/.vimrc && test -L ~/.inputrc && test -L ~/.gitignore_global"

      # Every repository in packages/git-pins must sit at exactly its pinned
      # commit, never at whatever the upstream branch held on the day.
      - name: Verify pinned repositories
        shell: bash
        run: |
          cat > /tmp/verify-pins.sh <<'EOF'
          bad=0
          while read -r kind name repo commit; do
            case "$kind" in
              ""|\#*)     continue ;;
              omz)        dest="$HOME/.oh-my-zsh" ;;
              zsh-plugin) dest="$HOME/.oh-my-zsh/custom/plugins/$name" ;;
              vim-plugin) dest="$HOME/.vim/pack/plugins/start/$name" ;;
            esac
            head=$(git -C "$dest" rev-parse HEAD 2>/dev/null || echo missing)
            if [ "$head" = "$commit" ]; then
              echo "ok   $name at ${commit:0:12} ($repo)"
            else
              echo "FAIL $name is at $head, pinned $commit"; bad=1
            fi
          done < "$1"
          exit $bad
          EOF
          su - testuser -c "bash /tmp/verify-pins.sh $GITHUB_WORKSPACE/packages/git-pins"
          su - testuser -c "test -f ~/.cache/ns-bootstrap/git-pins.applied" \
            || { echo "bootstrap did not record the pins it applied"; exit 1; }

      # A pin bump is only safe to merge if the shell still starts with it, so
      # load the real .zshrc interactively and check each pinned plugin loaded.
      - name: Start an interactive zsh on the pinned plugins
        shell: bash
        run: |
          cat > /tmp/zsh-smoke.zsh <<'EOF'
          (( ${+functions[omz]} ))                     && print "ok   oh-my-zsh"               || { print "FAIL oh-my-zsh not loaded"; exit 1 }
          (( ${+functions[_zsh_autosuggest_start]} ))  && print "ok   zsh-autosuggestions"     || { print "FAIL zsh-autosuggestions"; exit 1 }
          (( ${+ZSH_HIGHLIGHT_VERSION} ))              && print "ok   zsh-syntax-highlighting" || { print "FAIL zsh-syntax-highlighting"; exit 1 }
          (( ${+functions[enable-fzf-tab]} ))          && print "ok   fzf-tab"                 || { print "FAIL fzf-tab"; exit 1 }
          (( ${fpath[(Ie)$ZSH/custom/plugins/zsh-completions/src]} )) && print "ok   zsh-completions" || { print "FAIL zsh-completions"; exit 1 }
          EOF
          su - testuser -c "zsh -i -c 'source /tmp/zsh-smoke.zsh'" > /tmp/zsh.log 2>&1 || status=$?
          cat /tmp/zsh.log
          if grep -qE "plugin '.*' not found|parse error" /tmp/zsh.log; then
            echo "oh-my-zsh reported a broken plugin or a parse error"; exit 1
          fi
          if grep -q "applying" /tmp/zsh.log; then
            echo "the first shell re-applied pins that bootstrap had just applied"; exit 1
          fi
          exit "${status:-0}"

      # How a merged bump reaches an account: once the clone holds the new pin
      # file, the account's next interactive shell applies it, with no
      # update-my-system involved. Simulated by moving one pin to a real commit
      # two behind it, then checking the plugin moved exactly once.
      - name: A pin change reaches the account at its next shell
        shell: bash
        run: |
          pinned=$(awk '$2 == "zsh-syntax-highlighting" {print $4}' packages/git-pins)
          older=1d85c692615a25fe2293bdd44b34c217d5d2bf04
          sed -i "s/$pinned/$older/" packages/git-pins
          su - testuser -c "zsh -i -c 'git -C ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting rev-parse HEAD'" > /tmp/bump.log 2>&1 || true
          cat /tmp/bump.log
          grep -q "pinned plugins changed, applying" /tmp/bump.log \
            || { echo "the shell did not notice the pin change"; exit 1; }
          grep -qx "$older" /tmp/bump.log \
            || { echo "zsh-syntax-highlighting was not moved to the new pin"; exit 1; }
          su - testuser -c "zsh -i -c true" > /tmp/again.log 2>&1 || true
          if grep -q "applying" /tmp/again.log; then
            echo "the following shell applied the same pins again"; exit 1
          fi
          echo "The pin change was applied by the next shell, once."

  macos-smoke:
    name: macOS Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check all shell scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +

      - name: Zsh syntax check
        run: |
          zsh -n dotfiles/shell/.zshrc
          zsh -n dotfiles/shell/.zprofile

      - name: Install bats
        run: brew install bats-core

      - name: Run unit tests
        run: bats tests/

      - name: Dry run bootstrap
        run: ./install/bootstrap.sh --dry-run --profile minimal
